services:
  - type: web
    name: vulcan-club-api
    runtime: node
    region: singapore   # closest to India on Render's free tier
    plan: free
    buildCommand: npm install --omit=dev
    startCommand: node backend/server.mjs
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      # Set the following in the Render dashboard — do NOT commit real values here:
      - key: NEXT_PUBLIC_SUPABASE_URL
        sync: false
      - key: NEXT_PUBLIC_SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      # Comma-separated list of allowed frontend origins (your Vercel production URL)
      # e.g. https://vulcan-club.vercel.app,https://vulcanclub.org
      - key: FRONTEND_ORIGINS
        sync: false
